{
  "name": "Feature request",
  "description": "Explain a problem and how Wavebreak could help.",
  "title": "[Idea]: ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is public. Never include passwords, cookies, browsing history, private notes or sensitive URLs. Report security vulnerabilities privately using SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "What problem are you trying to solve?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "workaround",
      "attributes": {
        "label": "Current workaround"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Proposed behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "importance",
      "attributes": {
        "label": "Why does this matter in your workflow?"
      },
      "validations": {
        "required": true
      }
    }
  ]
}
